<div class="observatory" [class.is-still]="still()">
  <app-deep-field />
  <div class="field-vignette" aria-hidden="true"></div>
  <header class="home-masthead">
    <a class="home-wordmark" routerLink="/" aria-label="Haygen Warren, home"
      ><span class="pixel-mark" aria-hidden="true">✦</span> Haygen Warren</a
    >
    <button
      class="motion-control"
      type="button"
      (click)="toggleMotion()"
      [disabled]="arrival.reducedMotion()"
      [attr.aria-pressed]="still()"
      [attr.aria-label]="still() ? 'Resume orbital motion' : 'Pause orbital motion'"
    >
      <span aria-hidden="true">{{ still() ? '▷' : 'Ⅱ' }}</span>
      {{ arrival.reducedMotion() ? 'Reduced motion' : paused() ? 'Motion paused' : 'Pause motion' }}
    </button>
  </header>
  <section class="universe" aria-labelledby="home-title">
    <div class="universe-intro">
      <span class="small-label">A small corner of the universe</span>
      <p>Physics, photographs &amp; everything in between.</p>
    </div>
    <app-orbital-navigation [paused]="paused()" />
  </section>
  <footer class="home-footer">
    <nav class="personal-links" aria-label="About and social profiles">
      <a class="about-link" routerLink="/about"
        >A little about me <span aria-hidden="true">↗</span></a
      >
      <span class="link-divider" aria-hidden="true"></span>
      @for (link of socialLinks; track link.label) {
        <a [href]="link.href" target="_blank" rel="noopener noreferrer"
          >{{ link.label }}<span class="sr-only"> (opens in a new tab)</span></a
        >
      }
      <button type="button" (click)="resume.open()">Résumé / CV</button>
      <a href="mailto:haygenwarren@gmail.com">Email <span aria-hidden="true">↗</span></a>
    </nav>
    <div class="home-colophon">
      <span>Always looking a little closer.</span>
      <button type="button" (click)="arrival.playNext()" [disabled]="arrival.reducedMotion()">
        <span aria-hidden="true">↻</span> Replay arrival
      </button>
    </div>
  </footer>
  <app-resume-request #resume />
</div>
