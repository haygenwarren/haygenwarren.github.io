<nav #orbit class="orbit" aria-label="Explore my portfolio">
  <div class="orbit-stage">
    <svg class="orbit-lines" viewBox="0 0 800 540" preserveAspectRatio="none" aria-hidden="true">
      <!-- Radii match ORBIT_X / ORBIT_Y in orbital-navigation.ts. -->
      <ellipse cx="400" cy="270" rx="304" ry="216" />
      <ellipse class="inner-orbit" cx="400" cy="270" rx="185" ry="125" />
      <path d="M390 270h20M400 260v20" />
    </svg>
    <div class="portrait-hub">
      <div class="portrait-frame">
        <span class="portrait-spark spark-one" aria-hidden="true"></span>
        <span class="portrait-spark spark-two" aria-hidden="true"></span>
        <div class="portrait-crop">
          <img
            src="assets/headshot.jpg"
            alt="Haygen Warren"
            width="600"
            height="800"
            fetchpriority="high"
          />
        </div>
      </div>
      <h1 tabindex="-1" id="home-title">
        Haygen Warren<span class="name-dot" aria-hidden="true">.</span>
      </h1>
      <p>Student. Photographer. Writer.</p>
    </div>
    @for (destination of destinations; track destination.path; let i = $index) {
      <a
        #satellite
        class="satellite"
        [routerLink]="destination.path"
        [style.left.%]="initialX(i)"
        [style.top.%]="initialY(i)"
        [style.--planet-color]="destination.color"
        [attr.aria-current]="destination.path === '/' ? 'page' : null"
        (pointerenter)="hold(destination)"
        (pointerleave)="release()"
        (focus)="hold(destination, true)"
        (blur)="release(true)"
      >
        <span class="satellite-bubble"><app-pixel-icon [name]="destination.icon" /></span>
        <span class="satellite-label"
          >{{ destination.label }}<span class="destination-arrow" aria-hidden="true">↗</span></span
        >
      </a>
    }
  </div>
</nav>
<div class="orbit-caption" aria-live="polite">
  @if (hovered(); as destination) {
    <p class="destination-note">{{ destination.note }}</p>
  } @else {
    <p>
      Pick an orbit. See where it takes you.<span class="caption-star" aria-hidden="true">✧</span>
    </p>
  }
</div>
