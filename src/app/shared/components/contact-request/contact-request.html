<dialog
  #dialog
  class="contact-dialog"
  [attr.aria-labelledby]="id + '-title'"
  [attr.aria-describedby]="id + '-description'"
  (click)="onBackdrop($event)"
>
  <button class="dialog-close" type="button" [attr.aria-label]="closeLabel()" (click)="close()">
    ×
  </button>
  <span class="dialog-eyebrow">{{ eyebrow() }}</span>
  <h2 [id]="id + '-title'">{{ heading() }}</h2>
  <p [id]="id + '-description'">{{ description() }}</p>
  <form (submit)="request($event, email.value, message.value)">
    <label [for]="id + '-email'">Your email</label>
    <input
      #email
      [id]="id + '-email'"
      name="email"
      type="email"
      autocomplete="email"
      placeholder="you@example.com"
      maxlength="254"
      required
    />
    <label [for]="id + '-message'">A short message</label>
    <textarea
      #message
      [id]="id + '-message'"
      name="message"
      rows="4"
      [placeholder]="placeholder()"
      maxlength="1500"
      required
    ></textarea>
    <p class="email-note">
      This opens your email app with a request addressed to haygenwarren&#64;gmail.com. Send it
      there when you're ready.
    </p>
    <button class="request-button" type="submit">
      Open email draft <span aria-hidden="true">↗</span>
    </button>
    @if (draftOpened()) {
      <p class="draft-status" role="status">
        Continue in your email app to send your request. You can also email
        haygenwarren&#64;gmail.com directly.
      </p>
    }
  </form>
</dialog>
