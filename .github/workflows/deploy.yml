name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (generates content + compiles Angular)
        run: npm run build

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/portfolio/browser/index.html dist/portfolio/browser/404.html

      # GitHub Pages serves /research from research.html with a normal 200
      # response. Without these copies each page arrives through 404.html, and
      # link previews and search engines can treat it as missing.
      # Keep the list in step with the routes in src/app/app.routes.ts.
      - name: Give each page its own HTML file
        run: |
          for page in research experience writing education photography blog about; do
            cp dist/portfolio/browser/index.html "dist/portfolio/browser/$page.html"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
